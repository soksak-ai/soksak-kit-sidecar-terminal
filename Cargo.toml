[package]
name = "soksak-kit-sidecar-terminal"
version = "0.0.35"
edition = "2024"
publish = false
license = "MIT"
description = "Shared recovery runtime for soksak terminal-state sidecars."
repository = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
getrandom = "=0.3.4"
interprocess = "=2.4.2"
soksak-contract-control = { git = "https://github.com/soksak-ai/soksak-contract-control", rev = "51a4b7cbb369" }
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "d0b5e4375cf833ea61431079866b518d0e24c416" }
soksak-contract-surface = { git = "https://github.com/soksak-ai/soksak-contract-surface", rev = "f3c3b22" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[features]
integration-tests = []

[workspace]

[build-dependencies]
cc = "=1.4.4"
