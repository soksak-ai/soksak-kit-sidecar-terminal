[package]
name = "soksak-kit-sidecar-terminal"
version = "0.0.12"
edition = "2024"
publish = false
license = "MIT"
description = "Shared recovery runtime for soksak terminal-state sidecars."
repository = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
getrandom = "=0.3.4"
interprocess = "=2.4.2"
soksak-contract-control = { git = "https://github.com/soksak-ai/soksak-contract-control", rev = "6d1a1c8cbad7fa131bb4aef94a730fa6d18dbaff" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[features]
integration-tests = []

[workspace]
