[package]
name = "soksak-kit-sidecar-terminal"
version = "0.0.21"
edition = "2024"
publish = false
license = "MIT"
description = "Shared recovery runtime for soksak terminal-state sidecars."
repository = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
getrandom = "=0.3.4"
interprocess = "=2.4.2"
soksak-contract-control = { git = "https://github.com/soksak-ai/soksak-contract-control", rev = "2dbce68a373cffc5ecdd46de0637bd0722231545" }
soksak-contract-surface = { git = "https://github.com/soksak-ai/soksak-contract-surface", rev = "e03e3cfeeb1b44c950711b45cd614139af80005d" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[features]
integration-tests = []

[workspace]

[build-dependencies]
cc = "=1.4.4"
