[package]
name = "soksak-kit-sidecar-terminal"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "Shared recovery runtime for soksak terminal-state sidecars."
repository = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
getrandom = "=0.3.4"
interprocess = "=2.4.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[features]
integration-tests = []

[workspace]
